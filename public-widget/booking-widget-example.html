<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Service - Your Workshop</title>
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .booking-container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: #64748b;
            margin-bottom: 32px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #475569;
            margin-bottom: 8px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 24px;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .success-message {
            background: #10b981;
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            margin-top: 20px;
            display: none;
        }
        
        .error-message {
            background: #ef4444;
            color: white;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-top: 16px;
            display: none;
        }
        
        .required {
            color: #ef4444;
        }
        
        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .booking-container {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="booking-container">
        <h1>Book Your Service</h1>
        <p class="subtitle">Fill out the form below and we'll confirm your appointment</p>
        
        <form id="bookingForm">
            <!-- Customer Details -->
            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" id="customerName" required minlength="2" placeholder="John Smith">
            </div>
            
            <div class="grid">
                <div class="form-group">
                    <label>Phone Number <span class="required">*</span></label>
                    <input type="tel" id="customerPhone" required minlength="10" placeholder="021 123 4567">
                </div>
                
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="customerEmail" placeholder="john@example.com">
                </div>
            </div>
            
            <!-- Vehicle Details -->
            <div class="form-group">
                <label>Vehicle Registration</label>
                <input type="text" id="vehicleRego" placeholder="ABC123">
            </div>
            
            <div class="grid">
                <div class="form-group">
                    <label>Make</label>
                    <input type="text" id="vehicleMake" placeholder="Toyota">
                </div>
                
                <div class="form-group">
                    <label>Model</label>
                    <input type="text" id="vehicleModel" placeholder="Corolla">
                </div>
            </div>
            
            <!-- Service Details -->
            <div class="form-group">
                <label>Service Type <span class="required">*</span></label>
                <select id="serviceType" required>
                    <option value="">Select a service...</option>
                    <option value="WOF Inspection">WOF Inspection</option>
                    <option value="Oil Change">Oil Change & Service</option>
                    <option value="Brake Service">Brake Service</option>
                    <option value="Tire Replacement">Tire Replacement</option>
                    <option value="General Repair">General Repair</option>
                    <option value="Diagnostic">Diagnostic Check</option>
                </select>
            </div>
            
            <div class="grid">
                <div class="form-group">
                    <label>Preferred Date <span class="required">*</span></label>
                    <input type="date" id="preferredDate" required>
                </div>
                
                <div class="form-group">
                    <label>Preferred Time <span class="required">*</span></label>
                    <input type="time" id="preferredTime" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Additional Notes</label>
                <textarea id="notes" placeholder="Any specific concerns or requests?"></textarea>
            </div>
            
            <!-- hCaptcha -->
            <div class="form-group">
                <div class="h-captcha" data-sitekey="10000000-ffff-ffff-ffff-000000000001"></div>
            </div>
            
            <button type="submit" id="submitBtn">Book Appointment</button>
            
            <div class="success-message" id="successMessage">
                ✅ Booking confirmed! Check your phone and email for details.
            </div>
            
            <div class="error-message" id="errorMessage"></div>
        </form>
    </div>

    <script>
        // ============================================
        // CONFIGURATION - UPDATE THESE VALUES
        // ============================================
        const CONFIG = {
            API_URL: 'https://gearbox-workshop-production.up.railway.app/api/trpc',
            SHOP_ID: '1', // Your ledger/shop ID from Gearbox
            HCAPTCHA_SITEKEY: '10000000-ffff-ffff-ffff-000000000001' // Get from hCaptcha.com
        };

        // Set minimum date to today
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('preferredDate').min = today;

        // Form submission
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const successMsg = document.getElementById('successMessage');
            const errorMsg = document.getElementById('errorMessage');
            
            // Hide previous messages
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';
            
            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Booking...';
            
            try {
                // Get hCaptcha token
                const captchaToken = hcaptcha.getResponse();
                if (!captchaToken) {
                    throw new Error('Please complete the security check');
                }
                
                // Prepare booking data
                const bookingData = {
                    shopId: CONFIG.SHOP_ID,
                    customerName: document.getElementById('customerName').value,
                    customerPhone: document.getElementById('customerPhone').value,
                    customerEmail: document.getElementById('customerEmail').value || undefined,
                    vehicleRegistration: document.getElementById('vehicleRego').value || undefined,
                    vehicleMake: document.getElementById('vehicleMake').value || undefined,
                    vehicleModel: document.getElementById('vehicleModel').value || undefined,
                    serviceType: document.getElementById('serviceType').value,
                    preferredDate: document.getElementById('preferredDate').value,
                    preferredTime: document.getElementById('preferredTime').value,
                    notes: document.getElementById('notes').value || undefined,
                    captchaToken: captchaToken
                };
                
                // Make API call
                const response = await fetch(`${CONFIG.API_URL}/public.createBooking`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(bookingData)
                });
                
                const result = await response.json();
                
                if (result.error) {
                    throw new Error(result.error.message || 'Booking failed');
                }
                
                // Success!
                successMsg.style.display = 'block';
                document.getElementById('bookingForm').reset();
                hcaptcha.reset();
                
                // Scroll to success message
                successMsg.scrollIntoView({ behavior: 'smooth', block: 'center' });
                
            } catch (error) {
                console.error('Booking error:', error);
                errorMsg.textContent = error.message || 'Something went wrong. Please try again.';
                errorMsg.style.display = 'block';
                hcaptcha.reset();
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Book Appointment';
            }
        });
    </script>
</body>
</html>
