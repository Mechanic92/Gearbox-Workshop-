<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Service - Your Workshop</title>
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
    <style>
        :root {
            --primary: #10b981;
            --background: #050505;
            --card: #111111;
            --text: #ffffff;
            --text-muted: #888888;
            --border: #222222;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--background);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(16, 185, 129, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .booking-container {
            max-width: 600px;
            width: 100%;
            background: var(--card);
            border-radius: 32px;
            padding: 48px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .booking-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), #3b82f6);
        }
        
        h1 {
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: -0.05em;
            font-style: italic;
            text-transform: uppercase;
        }
        
        .subtitle {
            color: var(--text-muted);
            margin-bottom: 40px;
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        label {
            display: block;
            font-weight: 800;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 16px;
            background: #1a1a1a;
            border: 1px solid var(--border);
            border-radius: 16px;
            font-size: 16px;
            color: white;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            font-family: inherit;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: #222;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        select option {
            background: #111;
            color: white;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .time-slots {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }
        
        .time-slot {
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 700;
            font-size: 14px;
            background: #1a1a1a;
            color: var(--text-muted);
        }
        
        .time-slot:hover:not(.disabled) {
            border-color: var(--primary);
            color: white;
            background: rgba(16, 185, 129, 0.05);
        }
        
        .time-slot.selected {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
        }
        
        .time-slot.disabled {
            opacity: 0.1;
            cursor: not-allowed;
            filter: grayscale(1);
        }
        
        .calendar-sync {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            background: rgba(16, 185, 129, 0.05);
            border: 1px dashed var(--primary);
            border-radius: 16px;
            color: var(--primary);
            font-weight: 800;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 24px;
        }
        
        .calendar-sync:hover {
            background: var(--primary);
            color: black;
        }
        
        button#submitBtn {
            width: 100%;
            padding: 20px;
            background: var(--primary);
            color: black;
            border: none;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 32px;
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.2);
        }
        
        button#submitBtn:hover:not(:disabled) {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px rgba(16, 185, 129, 0.3);
            filter: brightness(1.1);
        }
        
        button#submitBtn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        button#lookupBtn {
            margin-top: 0; 
            width: auto; 
            padding: 0 24px; 
            font-size: 11px; 
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: #222;
            color: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button#lookupBtn:hover {
            background: #333;
            border-color: var(--text-muted);
        }
        
        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            font-weight: 800;
            font-size: 14px;
            margin-top: 24px;
            display: none;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 16px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 24px;
            display: none;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .info-badge {
            background: #222;
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 900;
            margin-left: 12px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        
        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .booking-container {
                padding: 32px 24px;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="booking-container">
        <h1>Book Service</h1>
        <p class="subtitle">Operational Node Entry // Select Protocol</p>
        
        <form id="bookingForm">
            <!-- Customer Details -->
            <div class="form-group">
                <label>Operator Name</label>
                <input type="text" id="customerName" required minlength="2" placeholder="FULL NAME">
            </div>
            
            <div class="grid">
                <div class="form-group">
                    <label>Comms Channel (Phone)</label>
                    <input type="tel" id="customerPhone" required minlength="10" placeholder="+64...">
                </div>
                
                <div class="form-group">
                    <label>Data Endpoint (Email)</label>
                    <input type="email" id="customerEmail" placeholder="user@domain.com">
                </div>
            </div>
            
            <!-- Vehicle Details -->
            <div class="form-group">
                <label>Asset Identifier (Plate)</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="vehicleRego" placeholder="ABC123" style="text-transform: uppercase;">
                    <button type="button" id="lookupBtn">Query</button>
                </div>
            </div>
            
            <div class="grid">
                <div class="form-group">
                    <label>Asset Make</label>
                    <input type="text" id="vehicleMake" placeholder="TOYOTA">
                </div>
                
                <div class="form-group">
                    <label>Asset Model</label>
                    <input type="text" id="vehicleModel" placeholder="COROLLA">
                </div>
            </div>

            
            <!-- Service Details -->
            <div class="form-group">
                <label>Operational Sequence</label>
                <select id="serviceType" required>
                    <option value="">Select Protocol...</option>
                    <option value="WOF Inspection" data-duration="45">WOF Inspection (45 min)</option>
                    <option value="Oil Change" data-duration="60">Oil Change & Service (1 hour)</option>
                    <option value="Brake Service" data-duration="120">Brake Service (2 hours)</option>
                    <option value="Tire Replacement" data-duration="90">Tire Replacement (1.5 hours)</option>
                    <option value="General Repair" data-duration="120">General Repair (2 hours)</option>
                    <option value="Diagnostic" data-duration="60">Diagnostic Check (1 hour)</option>
                </select>
            </div>
            
            <!-- Date Selection -->
            <div class="form-group">
                <label>Sequence Date</label>
                <input type="date" id="preferredDate" required>
            </div>
            
            <!-- Available Time Slots -->
            <div class="form-group" id="timeSlotsContainer" style="display: none;">
                <label>
                    Valid Chrono Slots
                    <span class="info-badge" id="slotsCount">0 NODE(S)</span>
                </label>
                <div id="timeSlots" class="time-slots"></div>
            </div>
            
            <div class="form-group">
                <label>Operational Notes</label>
                <textarea id="notes" placeholder="SYSTEM INPUTS..."></textarea>
            </div>
            
            <!-- hCaptcha -->
            <div class="form-group">
                <div class="h-captcha" data-sitekey="10000000-ffff-ffff-ffff-000000000001"></div>
            </div>
            
            <button type="submit" id="submitBtn">Initialize Booking</button>
            
            <!-- Google Calendar Sync -->
            <div class="calendar-sync" id="calendarSync" style="display: none;">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="18" height="18">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                Sync to Google Calendar
            </div>
            
            <div class="success-message" id="successMessage">
                Sync Success // Protocol Confirmed
            </div>
            
            <div class="error-message" id="errorMessage"></div>
        </form>
    </div>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const CONFIG = {
            API_URL: window.location.origin.includes('localhost') || window.location.origin.includes('127.0.0.1') 
                ? '/api/trpc' 
                : 'https://gearbox-workshop-production.up.railway.app/api/trpc',
            SHOP_ID: '1',
            HCAPTCHA_SITEKEY: '10000000-ffff-ffff-ffff-000000000001'
        };

        // State
        let selectedTimeSlot = null;
        let availableSlots = [];
        let bookingDetails = null;

        // Set minimum date to today
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('preferredDate').min = today;

        // Service type change handler
        document.getElementById('serviceType').addEventListener('change', () => {
            checkAvailability();
        });

        // Date change handler
        document.getElementById('preferredDate').addEventListener('change', () => {
            checkAvailability();
        });

        // Vehicle lookup handler
        document.getElementById('lookupBtn').addEventListener('click', async () => {
            const rego = document.getElementById('vehicleRego').value;
            if (!rego) return;
            
            const btn = document.getElementById('lookupBtn');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '...';
            
            try {
                // Using the pattern established in checkAvailability (POST to a query endpoint)
                const response = await fetch(`${CONFIG.API_URL}/public.vehicleLookup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        registration: rego
                    })
                });
                
                const result = await response.json();
                
                if (result.result?.data) {
                    const data = result.result.data;
                    document.getElementById('vehicleMake').value = data.make;
                    document.getElementById('vehicleModel').value = data.model;
                    
                    // Add a nice visual feedback
                    document.getElementById('vehicleRego').style.borderColor = '#10b981';
                    setTimeout(() => {
                        document.getElementById('vehicleRego').style.borderColor = '';
                    }, 2000);
                }
            } catch (error) {
                console.error('Lookup error:', error);
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        });


        // Check availability function
        async function checkAvailability() {
            const serviceType = document.getElementById('serviceType').value;
            const date = document.getElementById('preferredDate').value;
            
            if (!serviceType || !date) {
                document.getElementById('timeSlotsContainer').style.display = 'none';
                return;
            }
            
            const serviceOption = document.querySelector(`#serviceType option[value="${serviceType}"]`);
            const serviceDuration = parseInt(serviceOption?.dataset.duration || '60');
            
            const timeSlotsContainer = document.getElementById('timeSlotsContainer');
            const timeSlotsDiv = document.getElementById('timeSlots');
            
            timeSlotsContainer.style.display = 'block';
            timeSlotsDiv.innerHTML = '<div class="loading-slots">🔄 Checking availability...</div>';
            
            try {
                const response = await fetch(`${CONFIG.API_URL}/public.availability`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        shopId: CONFIG.SHOP_ID,
                        date: date,
                        serviceType: serviceType,
                        serviceDuration: serviceDuration
                    })
                });
                
                const result = await response.json();
                
                if (result.error) {
                    throw new Error(result.error.message);
                }
                
                availableSlots = result.result?.data?.slots || [];
                
                if (availableSlots.length === 0) {
                    timeSlotsDiv.innerHTML = '<div class="no-slots">❌ No available slots for this date. Please try another day.</div>';
                    document.getElementById('slotsCount').textContent = '0 available';
                    return;
                }
                
                // Render time slots
                timeSlotsDiv.innerHTML = '';
                document.getElementById('slotsCount').textContent = `${availableSlots.length} available`;
                
                availableSlots.forEach(slot => {
                    const slotDiv = document.createElement('div');
                    slotDiv.className = 'time-slot';
                    slotDiv.textContent = slot;
                    slotDiv.onclick = () => selectTimeSlot(slot, slotDiv);
                    timeSlotsDiv.appendChild(slotDiv);
                });
                
            } catch (error) {
                console.error('Availability check error:', error);
                timeSlotsDiv.innerHTML = '<div class="no-slots">⚠️ Could not check availability. Please try again.</div>';
            }
        }

        // Select time slot
        function selectTimeSlot(time, element) {
            // Remove previous selection
            document.querySelectorAll('.time-slot').forEach(slot => {
                slot.classList.remove('selected');
            });
            
            // Select new slot
            element.classList.add('selected');
            selectedTimeSlot = time;
        }

        // Generate Google Calendar link
        function generateCalendarLink(booking) {
            const startDate = new Date(`${booking.date}T${booking.time}:00`);
            const endDate = new Date(startDate.getTime() + (booking.duration * 60000));
            
            const formatDate = (date) => {
                return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
            };
            
            const params = new URLSearchParams({
                action: 'TEMPLATE',
                text: `${booking.serviceType} - ${booking.shopName}`,
                dates: `${formatDate(startDate)}/${formatDate(endDate)}`,
                details: `Service: ${booking.serviceType}\nVehicle: ${booking.vehicleRego || 'Not specified'}\n\nBooked via Gearbox`,
                location: booking.shopName,
                trp: 'false'
            });
            
            return `https://calendar.google.com/calendar/render?${params.toString()}`;
        }

        // Form submission
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const successMsg = document.getElementById('successMessage');
            const errorMsg = document.getElementById('errorMessage');
            const calendarSync = document.getElementById('calendarSync');
            
            // Validate time slot selection
            if (!selectedTimeSlot) {
                errorMsg.textContent = 'Please select an available time slot';
                errorMsg.style.display = 'block';
                return;
            }
            
            // Hide previous messages
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';
            calendarSync.style.display = 'none';
            
            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Booking...';
            
            try {
                // Get hCaptcha token
                const captchaToken = hcaptcha.getResponse();
                if (!captchaToken) {
                    throw new Error('Please complete the security check');
                }
                
                const serviceOption = document.querySelector(`#serviceType option:checked`);
                const serviceDuration = parseInt(serviceOption?.dataset.duration || '60');
                
                // Prepare booking data
                const bookingData = {
                    shopId: CONFIG.SHOP_ID,
                    customerName: document.getElementById('customerName').value,
                    customerPhone: document.getElementById('customerPhone').value,
                    customerEmail: document.getElementById('customerEmail').value || undefined,
                    vehicleRegistration: document.getElementById('vehicleRego').value || undefined,
                    vehicleMake: document.getElementById('vehicleMake').value || undefined,
                    vehicleModel: document.getElementById('vehicleModel').value || undefined,
                    serviceType: document.getElementById('serviceType').value,
                    preferredDate: document.getElementById('preferredDate').value,
                    preferredTime: selectedTimeSlot,
                    notes: document.getElementById('notes').value || undefined,
                    captchaToken: captchaToken
                };
                
                // Make API call
                const response = await fetch(`${CONFIG.API_URL}/public.createBooking`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(bookingData)
                });
                
                const result = await response.json();
                
                if (result.error) {
                    throw new Error(result.error.message || 'Booking failed');
                }
                
                // Store booking details for calendar sync
                bookingDetails = {
                    date: bookingData.preferredDate,
                    time: selectedTimeSlot,
                    serviceType: bookingData.serviceType,
                    duration: serviceDuration,
                    vehicleRego: bookingData.vehicleRegistration,
                    shopName: 'Your Workshop Name' // Update this
                };
                
                // Success!
                successMsg.style.display = 'block';
                calendarSync.style.display = 'flex';
                
                // Setup calendar sync button
                calendarSync.onclick = () => {
                    window.open(generateCalendarLink(bookingDetails), '_blank');
                };
                
                document.getElementById('bookingForm').reset();
                hcaptcha.reset();
                selectedTimeSlot = null;
                document.getElementById('timeSlotsContainer').style.display = 'none';
                
                // Scroll to success message
                successMsg.scrollIntoView({ behavior: 'smooth', block: 'center' });
                
            } catch (error) {
                console.error('Booking error:', error);
                errorMsg.textContent = error.message || 'Something went wrong. Please try again.';
                errorMsg.style.display = 'block';
                hcaptcha.reset();
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Book Appointment';
            }
        });
    </script>
</body>
</html>
