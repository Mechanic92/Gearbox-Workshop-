<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book & Pay - Your Workshop</title>
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .booking-container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: #64748b;
            margin-bottom: 32px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #475569;
            margin-bottom: 8px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        /* Time Slot Picker */
        .time-slots {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
            margin-top: 12px;
        }
        
        .time-slot {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 14px;
            background: white;
        }
        
        .time-slot:hover:not(.disabled) {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .time-slot.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }
        
        .time-slot.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            background: #f1f5f9;
        }
        
        /* Price Summary */
        .price-summary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 24px;
            border-radius: 16px;
            margin: 24px 0;
        }
        
        .price-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }
        
        .price-total {
            display: flex;
            justify-content: space-between;
            padding-top: 16px;
            border-top: 2px solid rgba(255,255,255,0.3);
            font-size: 24px;
            font-weight: 900;
        }
        
        .deposit-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            margin-left: 8px;
        }
        
        /* Payment Options */
        .payment-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .payment-option {
            padding: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        
        .payment-option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .payment-option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        
        .payment-option-title {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 4px;
        }
        
        .payment-option-desc {
            font-size: 12px;
            opacity: 0.7;
        }
        
        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 24px;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .success-message {
            background: #10b981;
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            margin-top: 20px;
            display: none;
        }
        
        .error-message {
            background: #ef4444;
            color: white;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-top: 16px;
            display: none;
        }
        
        .required {
            color: #ef4444;
        }
        
        .info-badge {
            display: inline-block;
            background: #f0f9ff;
            color: #0284c7;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }
        
        .secure-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: #f0fdf4;
            border-radius: 10px;
            color: #166534;
            font-size: 13px;
            font-weight: 600;
            margin-top: 16px;
        }
        
        @media (max-width: 640px) {
            .grid, .payment-options {
                grid-template-columns: 1fr;
            }
            
            .booking-container {
                padding: 24px;
            }
            
            .time-slots {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="booking-container">
        <h1>Book & Pay</h1>
        <p class="subtitle">Secure your appointment with instant payment</p>
        
        <form id="bookingForm">
            <!-- Customer Details -->
            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" id="customerName" required minlength="2" placeholder="John Smith">
            </div>
            
            <div class="grid">
                <div class="form-group">
                    <label>Phone Number <span class="required">*</span></label>
                    <input type="tel" id="customerPhone" required minlength="10" placeholder="021 123 4567">
                </div>
                
                <div class="form-group">
                    <label>Email <span class="required">*</span></label>
                    <input type="email" id="customerEmail" required placeholder="john@example.com">
                </div>
            </div>
            
            <!-- Vehicle Details -->
            <div class="form-group">
                <label>Vehicle Registration</label>
                <input type="text" id="vehicleRego" placeholder="ABC123">
            </div>
            
            <div class="grid">
                <div class="form-group">
                    <label>Make</label>
                    <input type="text" id="vehicleMake" placeholder="Toyota">
                </div>
                
                <div class="form-group">
                    <label>Model</label>
                    <input type="text" id="vehicleModel" placeholder="Corolla">
                </div>
            </div>
            
            <!-- Service Details -->
            <div class="form-group">
                <label>Service Type <span class="required">*</span></label>
                <select id="serviceType" required>
                    <option value="">Select a service...</option>
                    <option value="WOF Inspection" data-duration="45" data-price="65">WOF Inspection - $65</option>
                    <option value="Oil Change" data-duration="60" data-price="120">Oil Change & Service - $120</option>
                    <option value="Brake Service" data-duration="120" data-price="350">Brake Service - $350</option>
                    <option value="Tire Replacement" data-duration="90" data-price="280">Tire Replacement - $280</option>
                    <option value="General Repair" data-duration="120" data-price="150">General Repair - $150/hr</option>
                    <option value="Diagnostic" data-duration="60" data-price="95">Diagnostic Check - $95</option>
                </select>
            </div>
            
            <!-- Date Selection -->
            <div class="form-group">
                <label>Preferred Date <span class="required">*</span></label>
                <input type="date" id="preferredDate" required>
            </div>
            
            <!-- Available Time Slots -->
            <div class="form-group" id="timeSlotsContainer" style="display: none;">
                <label>
                    Available Time Slots <span class="required">*</span>
                    <span class="info-badge" id="slotsCount">0 available</span>
                </label>
                <div id="timeSlots" class="time-slots"></div>
            </div>
            
            <!-- Price Summary -->
            <div class="price-summary" id="priceSummary" style="display: none;">
                <div class="price-row">
                    <span>Service Fee</span>
                    <span id="servicePrice">$0.00</span>
                </div>
                <div class="price-row">
                    <span>GST (15%)</span>
                    <span id="gstAmount">$0.00</span>
                </div>
                <div class="price-total">
                    <span>Total</span>
                    <span id="totalPrice">$0.00</span>
                </div>
            </div>
            
            <!-- Payment Options -->
            <div class="form-group" id="paymentOptionsContainer" style="display: none;">
                <label>Payment Option <span class="required">*</span></label>
                <div class="payment-options">
                    <div class="payment-option" data-type="deposit" onclick="selectPaymentOption('deposit', this)">
                        <div class="payment-option-title">Pay Deposit</div>
                        <div class="payment-option-desc" id="depositAmount">$0.00 (50%)</div>
                    </div>
                    <div class="payment-option selected" data-type="full" onclick="selectPaymentOption('full', this)">
                        <div class="payment-option-title">Pay in Full</div>
                        <div class="payment-option-desc" id="fullAmount">$0.00</div>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label>Additional Notes</label>
                <textarea id="notes" placeholder="Any specific concerns or requests?"></textarea>
            </div>
            
            <!-- hCaptcha -->
            <div class="form-group">
                <div class="h-captcha" data-sitekey="10000000-ffff-ffff-ffff-000000000001"></div>
            </div>
            
            <button type="submit" id="submitBtn">Proceed to Payment</button>
            
            <div class="secure-badge">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
                Secured by Stripe - Your payment info is encrypted
            </div>
            
            <div class="success-message" id="successMessage">
                ✅ Payment successful! Booking confirmed. Check your email for details.
            </div>
            
            <div class="error-message" id="errorMessage"></div>
        </form>
    </div>

    <script>
        // ============================================
        // CONFIGURATION - UPDATE THESE VALUES
        // ============================================
        const CONFIG = {
            GEARBOX_API: 'https://gearbox-workshop-production.up.railway.app/api/trpc',
            SHOP_ID: '1',
            HCAPTCHA_SITEKEY: '10000000-ffff-ffff-ffff-000000000001',
            
            // Your existing payment endpoint
            PAYMENT_API: 'https://yourwebsite.com/api/create-payment',
            
            // Stripe public key (if using Stripe directly)
            STRIPE_PUBLIC_KEY: 'pk_test_...',
            
            // Deposit percentage (50% = 0.5)
            DEPOSIT_PERCENTAGE: 0.5
        };

        // Initialize Stripe (if using direct integration)
        const stripe = Stripe(CONFIG.STRIPE_PUBLIC_KEY);

        // State
        let selectedTimeSlot = null;
        let selectedPaymentType = 'full';
        let currentPrice = 0;
        let currentTotal = 0;

        // Set minimum date to today
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('preferredDate').min = today;

        // Service type change handler
        document.getElementById('serviceType').addEventListener('change', (e) => {
            updatePricing();
            checkAvailability();
        });

        // Date change handler
        document.getElementById('preferredDate').addEventListener('change', () => {
            checkAvailability();
        });

        // Update pricing display
        function updatePricing() {
            const serviceSelect = document.getElementById('serviceType');
            const selectedOption = serviceSelect.options[serviceSelect.selectedIndex];
            const price = parseFloat(selectedOption.dataset.price || 0);
            
            if (price > 0) {
                currentPrice = price;
                const gst = price * 0.15;
                const total = price + gst;
                currentTotal = total;
                
                document.getElementById('servicePrice').textContent = `$${price.toFixed(2)}`;
                document.getElementById('gstAmount').textContent = `$${gst.toFixed(2)}`;
                document.getElementById('totalPrice').textContent = `$${total.toFixed(2)}`;
                
                const depositAmount = total * CONFIG.DEPOSIT_PERCENTAGE;
                document.getElementById('depositAmount').textContent = `$${depositAmount.toFixed(2)} (${CONFIG.DEPOSIT_PERCENTAGE * 100}%)`;
                document.getElementById('fullAmount').textContent = `$${total.toFixed(2)}`;
                
                document.getElementById('priceSummary').style.display = 'block';
                document.getElementById('paymentOptionsContainer').style.display = 'block';
            } else {
                document.getElementById('priceSummary').style.display = 'none';
                document.getElementById('paymentOptionsContainer').style.display = 'none';
            }
        }

        // Select payment option
        window.selectPaymentOption = function(type, element) {
            document.querySelectorAll('.payment-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            element.classList.add('selected');
            selectedPaymentType = type;
        };

        // Check availability
        async function checkAvailability() {
            const serviceType = document.getElementById('serviceType').value;
            const date = document.getElementById('preferredDate').value;
            
            if (!serviceType || !date) {
                document.getElementById('timeSlotsContainer').style.display = 'none';
                return;
            }
            
            const serviceOption = document.querySelector(`#serviceType option[value="${serviceType}"]`);
            const serviceDuration = parseInt(serviceOption?.dataset.duration || '60');
            
            const timeSlotsContainer = document.getElementById('timeSlotsContainer');
            const timeSlotsDiv = document.getElementById('timeSlots');
            
            timeSlotsContainer.style.display = 'block';
            timeSlotsDiv.innerHTML = '<div style="text-align: center; padding: 20px; color: #64748b;">🔄 Checking availability...</div>';
            
            try {
                const response = await fetch(`${CONFIG.GEARBOX_API}/public.availability`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        shopId: CONFIG.SHOP_ID,
                        date: date,
                        serviceType: serviceType,
                        serviceDuration: serviceDuration
                    })
                });
                
                const result = await response.json();
                const slots = result.result?.data?.slots || [];
                
                if (slots.length === 0) {
                    timeSlotsDiv.innerHTML = '<div style="text-align: center; padding: 20px; color: #ef4444; background: #fef2f2; border-radius: 10px;">❌ No slots available. Try another date.</div>';
                    document.getElementById('slotsCount').textContent = '0 available';
                    return;
                }
                
                timeSlotsDiv.innerHTML = '';
                document.getElementById('slotsCount').textContent = `${slots.length} available`;
                
                slots.forEach(slot => {
                    const slotDiv = document.createElement('div');
                    slotDiv.className = 'time-slot';
                    slotDiv.textContent = slot;
                    slotDiv.onclick = () => {
                        document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
                        slotDiv.classList.add('selected');
                        selectedTimeSlot = slot;
                    };
                    timeSlotsDiv.appendChild(slotDiv);
                });
                
            } catch (error) {
                console.error('Availability error:', error);
                timeSlotsDiv.innerHTML = '<div style="text-align: center; padding: 20px; color: #ef4444;">⚠️ Error checking availability</div>';
            }
        }

        // Form submission
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMessage');
            
            if (!selectedTimeSlot) {
                errorMsg.textContent = 'Please select a time slot';
                errorMsg.style.display = 'block';
                return;
            }
            
            errorMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            
            try {
                const captchaToken = hcaptcha.getResponse();
                if (!captchaToken) throw new Error('Please complete security check');
                
                const paymentAmount = selectedPaymentType === 'full' 
                    ? currentTotal 
                    : currentTotal * CONFIG.DEPOSIT_PERCENTAGE;
                
                // Step 1: Create booking in Gearbox
                const bookingData = {
                    shopId: CONFIG.SHOP_ID,
                    customerName: document.getElementById('customerName').value,
                    customerPhone: document.getElementById('customerPhone').value,
                    customerEmail: document.getElementById('customerEmail').value,
                    vehicleRegistration: document.getElementById('vehicleRego').value || undefined,
                    vehicleMake: document.getElementById('vehicleMake').value || undefined,
                    vehicleModel: document.getElementById('vehicleModel').value || undefined,
                    serviceType: document.getElementById('serviceType').value,
                    preferredDate: document.getElementById('preferredDate').value,
                    preferredTime: selectedTimeSlot,
                    notes: document.getElementById('notes').value || undefined,
                    captchaToken: captchaToken
                };
                
                const bookingResponse = await fetch(`${CONFIG.GEARBOX_API}/public.createBooking`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bookingData)
                });
                
                const bookingResult = await bookingResponse.json();
                if (bookingResult.error) throw new Error(bookingResult.error.message);
                
                const bookingId = bookingResult.result?.data?.bookingId;
                
                // Step 2: Create payment session with YOUR existing payment API
                const paymentResponse = await fetch(CONFIG.PAYMENT_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        amount: paymentAmount,
                        currency: 'nzd',
                        bookingId: bookingId,
                        customerEmail: bookingData.customerEmail,
                        description: `${bookingData.serviceType} - ${selectedPaymentType === 'full' ? 'Full Payment' : 'Deposit'}`,
                        metadata: {
                            bookingId: bookingId,
                            serviceType: bookingData.serviceType,
                            paymentType: selectedPaymentType
                        }
                    })
                });
                
                const paymentResult = await paymentResponse.json();
                
                // Step 3: Redirect to payment page (Stripe Checkout or your payment page)
                if (paymentResult.url) {
                    window.location.href = paymentResult.url;
                } else if (paymentResult.clientSecret) {
                    // If using Stripe Elements, handle here
                    await handleStripePayment(paymentResult.clientSecret);
                }
                
            } catch (error) {
                console.error('Booking error:', error);
                errorMsg.textContent = error.message || 'Something went wrong';
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Proceed to Payment';
            }
        });

        // Handle Stripe payment (if using Elements)
        async function handleStripePayment(clientSecret) {
            const {error} = await stripe.confirmCardPayment(clientSecret);
            
            if (error) {
                throw new Error(error.message);
            } else {
                document.getElementById('successMessage').style.display = 'block';
                document.getElementById('bookingForm').reset();
            }
        }
    </script>
</body>
</html>
